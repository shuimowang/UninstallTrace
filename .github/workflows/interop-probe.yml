name: Windows interop probe
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/interop-probe.yml'
      - 'verification/compare-interop.ps1'
      - 'verification/PathAttributeProbe.cs'
      - 'verification/path_attribute_probe.rs'
permissions:
  contents: read
jobs:
  compare:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '10.0.x'
      - run: ./verification/compare-interop.ps1
        shell: pwsh
