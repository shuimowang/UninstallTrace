name: Windows verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build -c Release -warnaserror
      - run: dotnet run --project verification/DeepUninstaller.Verification.csproj -c Release
