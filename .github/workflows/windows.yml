name: Windows verification

on:
  workflow_dispatch:
    inputs:
      benchmark:
        description: Benchmark the complete desktop scanner
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build verification/DeepUninstaller.Verification.csproj -c Release -warnaserror
      - name: Verify integration fixtures on the disposable Windows runner
        if: runner.environment == 'github-hosted'
        env:
          UNINSTALLTRACE_DISPOSABLE_RUNNER: ${{ runner.environment }}
        run: dotnet run --project verification/DeepUninstaller.Verification.csproj -c Release --no-build -- --verify-integration
      - name: Verify startup items on the disposable Windows runner
        if: runner.environment == 'github-hosted'
        env:
          UNINSTALLTRACE_DISPOSABLE_RUNNER: ${{ runner.environment }}
        run: dotnet run --project verification/DeepUninstaller.Verification.csproj -c Release --no-build -- --verify-startup
      - name: Benchmark the complete desktop scanner
        if: github.event_name == 'workflow_dispatch' && inputs.benchmark && runner.environment == 'github-hosted'
        env:
          UNINSTALLTRACE_DISPOSABLE_RUNNER: ${{ runner.environment }}
        run: dotnet run --project verification/DeepUninstaller.Verification.csproj -c Release --no-build -- --benchmark-scan
